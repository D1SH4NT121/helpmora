    <text x="64" y="48" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#0C847A" letter-spacing="2">HELPMORA  /  PROJECT SCOPE</text>
    <text x="64" y="103" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800" text-anchor="start" fill="#0B132B">HELPmora at a glance</text>
    <text x="64" y="140" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="450" text-anchor="start" fill="#59677D">Documented project inventory — distinguish catalog counts from verified runtime capabilities.</text>
    <rect x="64" y="190" width="450" height="190" rx="22" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="64" y="190" width="450" height="8" rx="4" fill="#0C847A" stroke="#0C847A" stroke-width="0"/><text x="92" y="263" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="58" font-weight="850" text-anchor="start" fill="#0C847A">40</text><text x="196" y="238" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" fill="#15223B">CURATED PROGRAM ENTRIES</text><text x="196" y="271" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Cataloged across the support domains</text><text x="196" y="296" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Rules and source data need periodic review.</text><rect x="575" y="190" width="450" height="190" rx="22" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="575" y="190" width="450" height="8" rx="4" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/><text x="603" y="263" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="58" font-weight="850" text-anchor="start" fill="#F59E0B">26</text><text x="707" y="238" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" fill="#15223B">CURATED BRIDGE TRANSITIONS</text><text x="707" y="271" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Graph edges for alternative procedural routes</text><text x="707" y="296" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Pathfinder searches these configured paths.</text><rect x="1086" y="190" width="450" height="190" rx="22" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="1086" y="190" width="450" height="8" rx="4" fill="#3B82F6" stroke="#3B82F6" stroke-width="0"/><text x="1114" y="263" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="58" font-weight="850" text-anchor="start" fill="#3B82F6">51</text><text x="1218" y="238" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" fill="#15223B">LOCALIZATION DICTIONARIES</text><text x="1218" y="271" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Files recorded in the project handbook</text><text x="1218" y="296" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Dictionary count is not language-quality proof.</text><text x="64" y="448" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#0C847A" letter-spacing="1.8">FIVE AREAS OF SUPPORT</text><rect x="64.0" y="475" width="280.0" height="200" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1" filter="url(#shadow)"/><circle cx="96.0" cy="510" r="10" fill="#0C847A"/><text x="118.0" y="516" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="750" text-anchor="start" fill="#15223B">Housing &amp; shelter</text><text x="86.0" y="566" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Housing, shelter,</text><text x="86.0" y="590" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">safe accommodation</text><rect x="86.0" y="620" width="236.0" height="5" rx="3" fill="#E6F7F4" stroke="#E6F7F4" stroke-width="0"/><rect x="362.0" y="475" width="280.0" height="200" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1" filter="url(#shadow)"/><circle cx="394.0" cy="510" r="10" fill="#F59E0B"/><text x="416.0" y="516" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="750" text-anchor="start" fill="#15223B">Food &amp; nutrition</text><text x="384.0" y="566" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Food access,</text><text x="384.0" y="590" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">nutrition support</text><rect x="384.0" y="620" width="236.0" height="5" rx="3" fill="#FFF5D9" stroke="#FFF5D9" stroke-width="0"/><rect x="660.0" y="475" width="280.0" height="200" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1" filter="url(#shadow)"/><circle cx="692.0" cy="510" r="10" fill="#E85D8F"/><text x="714.0" y="516" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="750" text-anchor="start" fill="#15223B">Healthcare</text><text x="682.0" y="566" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Healthcare,</text><text x="682.0" y="590" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">medical relief</text><rect x="682.0" y="620" width="236.0" height="5" rx="3" fill="#FFF0F5" stroke="#FFF0F5" stroke-width="0"/><rect x="958.0" y="475" width="280.0" height="200" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1" filter="url(#shadow)"/><circle cx="990.0" cy="510" r="10" fill="#3B82F6"/><text x="1012.0" y="516" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="750" text-anchor="start" fill="#15223B">Financial security</text><text x="980.0" y="566" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Pensions, livelihood,</text><text x="980.0" y="590" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">financial support</text><rect x="980.0" y="620" width="236.0" height="5" rx="3" fill="#EAF2FF" stroke="#EAF2FF" stroke-width="0"/><rect x="1256.0" y="475" width="280.0" height="200" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1" filter="url(#shadow)"/><circle cx="1288.0" cy="510" r="10" fill="#7567E8"/><text x="1310.0" y="516" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="750" text-anchor="start" fill="#15223B">Legal aid &amp; rights</text><text x="1278.0" y="566" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Legal services,</text><text x="1278.0" y="590" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">citizen rights</text><rect x="1278.0" y="620" width="236.0" height="5" rx="3" fill="#F0EEFF" stroke="#F0EEFF" stroke-width="0"/><rect x="64" y="725" width="1472" height="112" rx="20" fill="#0B132B" stroke="#0B132B" stroke-width="1"/><circle cx="98" cy="760" r="7" fill="#10B981"/><text x="120" y="767" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="750" text-anchor="start" fill="#FFFFFF">Interpret the counts responsibly</text><text x="96" y="801" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#D2DCEB">These figures describe the documented repository inventory. They do not by themselves prove current policy accuracy,</text><text x="96" y="824" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#D2DCEB">full language coverage, or live Omi / Qdrant / Lyzr connectivity. Verify each against the running build.</text></svg>