t" fill="#59677D">Both enter through their</text><text x="874" y="441.75" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">appropriate protected routes.</text><rect x="1220" y="352" width="286" height="112" rx="20" fill="#E6F7F4" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="1220" y="352" width="7" height="112" rx="4" fill="#0C847A" stroke="#0C847A" stroke-width="0"/><text x="1246" y="391" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="750" text-anchor="start" fill="#15223B">cmguard + app API</text><text x="1246" y="420.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Only intended public routes</text><text x="1246" y="441.75" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">are exposed.</text><path d="M 1138 408 H 1220" stroke="#0C847A" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="848" y="514" width="290" height="112" rx="20" fill="#F0EEFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="848" y="514" width="7" height="112" rx="4" fill="#7567E8" stroke="#7567E8" stroke-width="0"/><text x="874" y="553" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="750" text-anchor="start" fill="#15223B">Qdrant</text><text x="874" y="582.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Local or cloud/server mode</text><text x="874" y="603.75" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">as configured and verified.</text><rect x="1220" y="514" width="286" height="112" rx="20" fill="#FFF5D9" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="1220" y="514" width="7" height="112" rx="4" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/><text x="1246" y="553" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="750" text-anchor="start" fill="#15223B">Lyzr + model providers</text><text x="1246" y="582.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Only configured services;</text><text x="1246" y="603.75" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">monitor outages and latency.</text><path d="M 993 464 V 514" stroke="#7567E8" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><path d="M 1363 464 V 514" stroke="#F59E0B" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="848" y="680" width="658" height="110" rx="20" fill="#F2F5FA" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="848" y="680" width="7" height="110" rx="4" fill="#0B132B" stroke="#0B132B" stroke-width="0"/><text x="874" y="719" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="750" text-anchor="start" fill="#15223B">Deployment checklist</text><text x="874" y="748.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">HTTPS · environment-based secrets · health checks · log redaction</text><text x="874" y="769.75" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">No .env in Git · test webhooks against real routes</text><text x="64" y="887" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="550" text-anchor="start" fill="#59677D">Do not assume QDRANT_STORAGE_PATH behavior; verify how the current client selects local vs server/cloud mode.</text></svg>