<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#16233B" flood-opacity="0.08"/></filter>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#0C847A"/></marker>
      <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3B82F6"/></marker>
      <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C847A"/><stop offset="1" stop-color="#10B981"/></linearGradient>
      <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B132B"/><stop offset="0.52" stop-color="#121C37"/><stop offset="1" stop-color="#162D43"/></linearGradient>
      <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#DCE5EF" stroke-width="1" opacity="0.55"/></pattern>
    </defs>
    <rect width="1600" height="1040" fill="#F4F7FB"/>
    <rect width="1600" height="1040" fill="url(#grid)" opacity="0.34"/>
    <circle cx="1540" cy="-25" r="205" fill="#E6F7F4" opacity="0.52"/>
    <circle cx="1590" cy="-50" r="120" fill="#EAF2FF" opacity="0.50"/>
    <text x="64" y="48" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#0C847A" letter-spacing="2">HELPMORA  /  SECURITY &amp; PRIVACY</text>
    <text x="64" y="103" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800" text-anchor="start" fill="#0B132B">Trust boundaries by design</text>
    <text x="64" y="140" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="450" text-anchor="start" fill="#59677D">Validate the edge, minimize sensitive data, isolate memory and preserve user control.</text>
    <rect x="64" y="205" width="340" height="310" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="64" y="205" width="340" height="8" rx="4" fill="#3B82F6" stroke="#3B82F6" stroke-width="0"/><text x="88" y="247" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="850" text-anchor="start" fill="#3B82F6" letter-spacing="1.1">1  INPUTS</text><circle cx="95" cy="292" r="5" fill="#3B82F6"/><text x="112" y="297" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Omi webhook</text><circle cx="95" cy="340" r="5" fill="#3B82F6"/><text x="112" y="345" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Typed chat</text><circle cx="95" cy="388" r="5" fill="#3B82F6"/><text x="112" y="393" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Browser voice (optional)</text><rect x="440" y="205" width="340" height="310" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="440" y="205" width="340" height="8" rx="4" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/><text x="464" y="247" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="850" text-anchor="start" fill="#F59E0B" letter-spacing="1.1">2  GATEWAY</text><circle cx="471" cy="292" r="5" fill="#F59E0B"/><text x="488" y="297" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Route allowlist</text><circle cx="471" cy="340" r="5" fill="#F59E0B"/><text x="488" y="345" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Auth / token checks</text><circle cx="471" cy="388" r="5" fill="#F59E0B"/><text x="488" y="393" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Payload size + depth</text><circle cx="471" cy="436" r="5" fill="#F59E0B"/><text x="488" y="441" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Rate &amp; budget limits</text><rect x="816" y="205" width="340" height="310" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="816" y="205" width="340" height="8" rx="4" fill="#0C847A" stroke="#0C847A" stroke-width="0"/><text x="840" y="247" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="850" text-anchor="start" fill="#0C847A" letter-spacing="1.1">3  CORE LOGIC</text><circle cx="847" cy="292" r="5" fill="#0C847A"/><text x="864" y="297" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Domain / crisis guard</text><circle cx="847" cy="340" r="5" fill="#0C847A"/><text x="864" y="345" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Case normalization</text><circle cx="847" cy="388" r="5" fill="#0C847A"/><text x="864" y="393" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Deterministic Jac tools</text><circle cx="847" cy="436" r="5" fill="#0C847A"/><text x="864" y="441" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Verification gate</text><rect x="1192" y="205" width="340" height="310" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="1192" y="205" width="340" height="8" rx="4" fill="#7567E8" stroke="#7567E8" stroke-width="0"/><text x="1216" y="247" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="850" text-anchor="start" fill="#7567E8" letter-spacing="1.1">4  SERVICES</text><circle cx="1223" cy="292" r="5" fill="#7567E8"/><text x="1240" y="297" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Qdrant: scoped memory</text><circle cx="1223" cy="340" r="5" fill="#7567E8"/><text x="1240" y="345" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Lyzr: configured agents</text><circle cx="1223" cy="388" r="5" fill="#7567E8"/><text x="1240" y="393" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">NIM/fallback: if used</text><circle cx="1223" cy="436" r="5" fill="#7567E8"/><text x="1240" y="441" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start" fill="#15223B">Never expose secrets</text><path d="M 404 360 H 432" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><path d="M 780 360 H 808" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><path d="M 1156 360 H 1184" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="64" y="555" width="1472" height="112" rx="18" fill="#FFF0EF" stroke="#F3C3C3" stroke-width="1.2"/><circle cx="98" cy="590" r="9" fill="#C84646"/><text x="120" y="596" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="850" text-anchor="start" fill="#C84646" letter-spacing="1.2">BLOCKED / NEVER TRUST</text><text x="90" y="633" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="650" text-anchor="start" fill="#15223B">Unvalidated webhooks  •  Cross-user memory  •  Secrets in frontend/logs  •  LLM-invented eligibility or helplines  •  External action without approval</text><text x="64" y="714" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="850" text-anchor="start" fill="#0C847A" letter-spacing="1.5">CITIZEN-CONTROLLED SAFETY</text><rect x="64" y="744" width="352" height="160" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1"/><circle cx="92" cy="774" r="7" fill="#0C847A"/><text x="110" y="780" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" text-anchor="start" fill="#15223B">Consent</text><text x="86" y="819" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Memory is retained only when the</text><text x="86" y="841" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">configured preference allows it.</text><rect x="440" y="744" width="352" height="160" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1"/><circle cx="468" cy="774" r="7" fill="#3B82F6"/><text x="486" y="780" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" text-anchor="start" fill="#15223B">Isolation</text><text x="462" y="819" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Every retrieval/update/delete uses an</text><text x="462" y="841" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">authorized user or tenant scope.</text><rect x="816" y="744" width="352" height="160" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1"/><circle cx="844" cy="774" r="7" fill="#E85D8F"/><text x="862" y="780" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" text-anchor="start" fill="#15223B">Forget</text><text x="838" y="819" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Deletion removes the intended stored</text><text x="838" y="841" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">case memories and related state.</text><rect x="1192" y="744" width="352" height="160" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1"/><circle cx="1220" cy="774" r="7" fill="#F59E0B"/><text x="1238" y="780" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="800" text-anchor="start" fill="#15223B">Quick Exit</text><text x="1214" y="819" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Existing quick-exit behavior remains</text><text x="1214" y="841" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">available and is regression-tested.</text><text x="64" y="950" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="550" text-anchor="start" fill="#59677D">Documentation is not proof of security. Confirm each protection with current code, configuration and tests.</text></svg>