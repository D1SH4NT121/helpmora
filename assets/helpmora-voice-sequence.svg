    <text x="64" y="48" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#0C847A" letter-spacing="2">HELPMORA  /  EVENT SEQUENCE</text>
    <text x="64" y="103" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800" text-anchor="start" fill="#0B132B">Voice-to-response sequence</text>
    <text x="64" y="140" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="450" text-anchor="start" fill="#59677D">A fast webhook acknowledgement is separate from the later conversation result.</text>
    <rect x="35" y="175" width="190" height="78" rx="16" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="35" y="175" width="190" height="6" rx="3" fill="#0C847A" stroke="#0C847A" stroke-width="0"/><text x="130" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#15223B">OMI</text><text x="130" y="234" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="550" text-anchor="middle" fill="#59677D">voice / transcript</text><line x1="130" y1="253" x2="130" y2="1030" stroke="#C9D4E2" stroke-width="1.5" opacity="0.95" stroke-dasharray="5 7"/><rect x="275" y="175" width="190" height="78" rx="16" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="275" y="175" width="190" height="6" rx="3" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/><text x="370" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#15223B">CMGUARD</text><text x="370" y="234" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="550" text-anchor="middle" fill="#59677D">route + validation</text><line x1="370" y1="253" x2="370" y2="1030" stroke="#C9D4E2" stroke-width="1.5" opacity="0.95" stroke-dasharray="5 7"/><rect x="515" y="175" width="190" height="78" rx="16" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="515" y="175" width="190" height="6" rx="3" fill="#3B82F6" stroke="#3B82F6" stroke-width="0"/><text x="610" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#15223B">SHARED SERVICE</text><text x="610" y="234" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="550" text-anchor="middle" fill="#59677D">conversation turn</text><line x1="610" y1="253" x2="610" y2="1030" stroke="#C9D4E2" stroke-width="1.5" opacity="0.95" stroke-dasharray="5 7"/><rect x="755" y="175" width="190" height="78" rx="16" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="755" y="175" width="190" height="6" rx="3" fill="#3B82F6" stroke="#3B82F6" stroke-width="0"/><text x="850" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#15223B">QDRANT</text><text x="850" y="234" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="550" text-anchor="middle" fill="#59677D">scoped memory</text><line x1="850" y1="253" x2="850" y2="1030" stroke="#C9D4E2" stroke-width="1.5" opacity="0.95" stroke-dasharray="5 7"/><rect x="995" y="175" width="190" height="78" rx="16" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="995" y="175" width="190" height="6" rx="3" fill="#7567E8" stroke="#7567E8" stroke-width="0"/><text x="1090" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#15223B">LYZR</text><text x="1090" y="234" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="550" text-anchor="middle" fill="#59677D">agent orchestration</text><line x1="1090" y1="253" x2="1090" y2="1030" stroke="#C9D4E2" stroke-width="1.5" opacity="0.95" stroke-dasharray="5 7"/><rect x="1235" y="175" width="190" height="78" rx="16" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="1235" y="175" width="190" height="6" rx="3" fill="#10B981" stroke="#10B981" stroke-width="0"/><text x="1330" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#15223B">JAC CORE</text><text x="1330" y="234" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="550" text-anchor="middle" fill="#59677D">policy tools</text><line x1="1330" y1="253" x2="1330" y2="1030" stroke="#C9D4E2" stroke-width="1.5" opacity="0.95" stroke-dasharray="5 7"/><rect x="1475" y="175" width="190" height="78" rx="16" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="1475" y="175" width="190" height="6" rx="3" fill="#E85D8F" stroke="#E85D8F" stroke-width="0"/><text x="1570" y="210" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle" fill="#15223B">HELPmora UI</text><text x="1570" y="234" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="550" text-anchor="middle" fill="#59677D">response + trace</text><line x1="1570" y1="253" x2="1570" y2="1030" stroke="#C9D4E2" stroke-width="1.5" opacity="0.95" stroke-dasharray="5 7"/><path d="M 130 315 H 370" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="145.0" y="285" width="210" height="25" rx="7" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/><text x="250.0" y="303" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" fill="#15223B">1. Transcript event</text><path d="M 370 390 H 610" stroke="#F59E0B" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="385.0" y="360" width="210" height="25" rx="7" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/><text x="490.0" y="378" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" fill="#15223B">2. Validate + normalize</text><path d="M 370 455 H 130" stroke="#10B981" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="120" y="426" width="260" height="26" rx="7" fill="#E7F9F0" stroke="#E7F9F0" stroke-width="0"/><text x="250" y="445" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0C847A">3. Accepted quickly (HTTP 200)</text><path d="M 610 520 H 850" stroke="#3B82F6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="625.0" y="490" width="210" height="25" rx="7" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/><text x="730.0" y="508" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" fill="#15223B">4. Retrieve memory</text><path d="M 850 590 H 610" stroke="#3B82F6" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)" stroke-dasharray="5 5"/><rect x="630" y="561" width="270" height="25" rx="7" fill="#EAF2FF" stroke="#EAF2FF" stroke-width="0"/><text x="765" y="579" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#3B82F6">5. Relevant context / none</text><path d="M 610 660 H 1090" stroke="#7567E8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="745.0" y="630" width="210" height="25" rx="7" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/><text x="850.0" y="648" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" fill="#15223B">6. Orchestrate if configured</text><path d="M 1090 735 H 1330" stroke="#7567E8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="1105.0" y="705" width="210" height="25" rx="7" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/><text x="1210.0" y="723" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" fill="#15223B">7. Invoke deterministic tools</text><path d="M 1330 810 H 610" stroke="#10B981" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="805" y="781" width="320" height="25" rx="7" fill="#E7F9F0" stroke="#E7F9F0" stroke-width="0"/><text x="965" y="799" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0C847A">8. Structured policy / path result</text><path d="M 610 885 H 850" stroke="#3B82F6" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)" stroke-dasharray="7 5"/><rect x="625.0" y="855" width="210" height="25" rx="7" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/><text x="730.0" y="873" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" fill="#15223B">9. Store allowed milestone</text><path d="M 610 960 H 1570" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="985.0" y="930" width="210" height="25" rx="7" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="0"/><text x="1090.0" y="948" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="650" text-anchor="middle" fill="#15223B">10. Response + real trace</text><rect x="65" y="1053" width="1670" height="80" rx="16" fill="#0B132B" stroke="#0B132B" stroke-width="1"/><text x="90" y="1084" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="850" text-anchor="start" fill="#73DCCD" letter-spacing="1.5">BROWSER VOICE</text><text x="255" y="1084" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="550" text-anchor="start" fill="#FFFFFF">The browser microphone adapter calls the same shared conversation service. It is a fallback input—not an Omi event.</text><text x="90" y="1110" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#CED8E7">Statuses must reflect completed operations; do not infer memory retrieval or agent success from a button click.</text></svg>