    <text x="64" y="48" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#0C847A" letter-spacing="2">HELPMORA  /  HACKATHON DEMO</text>
    <text x="64" y="103" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800" text-anchor="start" fill="#0B132B">A five-minute demo that proves the connected loop</text>
    <text x="64" y="140" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="450" text-anchor="start" fill="#59677D">Use a synthetic case; show actual events and an honest result, including empty-memory or unavailable states.</text>
    <rect x="64" y="175" width="1472" height="115" rx="20" fill="#0B132B" stroke="#0B132B" stroke-width="1"/><rect x="90" y="197" width="158" height="32" rx="16" fill="#20314F" stroke="#3D5577" stroke-width="1"/><text x="169.0" y="218" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#75DED0">DEMO SCENARIO</text><text x="90" y="247" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start" fill="#FFFFFF">“My husband is in hospital and we cannot afford the treatment. What government</text><text x="90" y="277" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="650" text-anchor="start" fill="#FFFFFF">healthcare support might we be eligible to check?”</text><rect x="64.0" y="350" width="232.0" height="205" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><circle cx="92.0" cy="382" r="16" fill="#0C847A"/><text x="92.0" y="388" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="850" text-anchor="middle" fill="#FFFFFF">01</text><text x="82.0" y="430" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="850" text-anchor="start" fill="#15223B">VOICE IN</text><text x="82.0" y="469" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">Real Omi transcript</text><text x="82.0" y="491" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">event</text><rect x="82.0" y="523" width="196.0" height="4" rx="2" fill="#E6F7F4" stroke="#E6F7F4" stroke-width="0"/><path d="M 296.0 452 H 310.0" stroke="#0C847A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="312.0" y="350" width="232.0" height="205" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><circle cx="340.0" cy="382" r="16" fill="#3B82F6"/><text x="340.0" y="388" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="850" text-anchor="middle" fill="#FFFFFF">02</text><text x="330.0" y="430" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="850" text-anchor="start" fill="#15223B">CASE CONTEXT</text><text x="330.0" y="469" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">Scoped Qdrant search</text><rect x="330.0" y="523" width="196.0" height="4" rx="2" fill="#EAF2FF" stroke="#EAF2FF" stroke-width="0"/><path d="M 544.0 452 H 558.0" stroke="#0C847A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="560.0" y="350" width="232.0" height="205" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><circle cx="588.0" cy="382" r="16" fill="#7567E8"/><text x="588.0" y="388" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="850" text-anchor="middle" fill="#FFFFFF">03</text><text x="578.0" y="430" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="850" text-anchor="start" fill="#15223B">AGENT ROUTING</text><text x="578.0" y="469" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">Real Lyzr Manager</text><text x="578.0" y="491" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">call</text><rect x="578.0" y="523" width="196.0" height="4" rx="2" fill="#F0EEFF" stroke="#F0EEFF" stroke-width="0"/><path d="M 792.0 452 H 806.0" stroke="#0C847A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="808.0" y="350" width="232.0" height="205" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><circle cx="836.0" cy="382" r="16" fill="#10B981"/><text x="836.0" y="388" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="850" text-anchor="middle" fill="#FFFFFF">04</text><text x="826.0" y="430" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="850" text-anchor="start" fill="#15223B">POLICY CHECK</text><text x="826.0" y="469" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">Existing Jac</text><text x="826.0" y="491" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">rules/tools</text><rect x="826.0" y="523" width="196.0" height="4" rx="2" fill="#E7F9F0" stroke="#E7F9F0" stroke-width="0"/><path d="M 1040.0 452 H 1054.0" stroke="#0C847A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="1056.0" y="350" width="232.0" height="205" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><circle cx="1084.0" cy="382" r="16" fill="#F59E0B"/><text x="1084.0" y="388" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="850" text-anchor="middle" fill="#FFFFFF">05</text><text x="1074.0" y="430" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="850" text-anchor="start" fill="#15223B">VERIFY</text><text x="1074.0" y="469" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">Missing facts +</text><text x="1074.0" y="491" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">provenance</text><rect x="1074.0" y="523" width="196.0" height="4" rx="2" fill="#FFF5D9" stroke="#FFF5D9" stroke-width="0"/><path d="M 1288.0 452 H 1302.0" stroke="#0C847A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="1304.0" y="350" width="232.0" height="205" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><circle cx="1332.0" cy="382" r="16" fill="#E85D8F"/><text x="1332.0" y="388" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="850" text-anchor="middle" fill="#FFFFFF">06</text><text x="1322.0" y="430" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="850" text-anchor="start" fill="#15223B">GUIDE</text><text x="1322.0" y="469" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">Next step + user</text><text x="1322.0" y="491" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">review</text><rect x="1322.0" y="523" width="196.0" height="4" rx="2" fill="#FFF0F5" stroke="#FFF0F5" stroke-width="0"/><rect x="64" y="600" width="900" height="255" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><text x="92" y="640" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="850" text-anchor="start" fill="#0C847A" letter-spacing="1.5">WHAT THE JUDGE SHOULD SEE</text><circle cx="98" cy="675" r="4" fill="#10B981"/><text x="112" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">Trace ID</text><text x="230" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">A real run identifier and timestamps</text><circle cx="98" cy="707" r="4" fill="#10B981"/><text x="112" y="712" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">Qdrant</text><text x="230" y="712" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">Retrieved matches or a genuine empty result</text><circle cx="98" cy="739" r="4" fill="#10B981"/><text x="112" y="744" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">Lyzr</text><text x="230" y="744" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">Actual Manager/agent execution result</text><circle cx="98" cy="771" r="4" fill="#10B981"/><text x="112" y="776" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">Jac</text><text x="230" y="776" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">Deterministic policy output—not an LLM guess</text><circle cx="98" cy="803" r="4" fill="#10B981"/><text x="112" y="808" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">Privacy</text><text x="230" y="808" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">Scoped memory and approval behavior</text><rect x="995" y="600" width="541" height="255" rx="20" fill="#FFF5D9" stroke="#F1D58B" stroke-width="1.2"/><text x="1024" y="640" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="850" text-anchor="start" fill="#9A6700" letter-spacing="1.5">DEMO INTEGRITY</text><text x="1024" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="550" text-anchor="start" fill="#15223B">Do not hard-code an eligibility result.</text><text x="1024" y="706" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="550" text-anchor="start" fill="#15223B">Do not fake a Qdrant retrieval or agent state.</text><text x="1024" y="732" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="550" text-anchor="start" fill="#15223B">Do not claim approval or policy freshness</text><text x="1024" y="758" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="550" text-anchor="start" fill="#15223B">without supporting evidence.</text><text x="1024" y="784" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="550" text-anchor="start" fill="#15223B"></text><text x="1024" y="810" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="550" text-anchor="start" fill="#15223B">If a service is unavailable, show the real</text><text x="1024" y="836" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="550" text-anchor="start" fill="#15223B">status and continue only through safe fallback.</text><rect x="64" y="887" width="1472" height="55" rx="14" fill="#0B132B" stroke="#0B132B" stroke-width="1"/><text x="90" y="921" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="850" text-anchor="start" fill="#7FE3D4" letter-spacing="1.4">CLOSE WITH:</text><text x="220" y="921" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#FFFFFF">“AI coordinates the journey. HELPmora’s deterministic policy logic decides eligibility.”</text></svg>