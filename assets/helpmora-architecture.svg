<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#16233B" flood-opacity="0.08"/></filter>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#0C847A"/></marker>
      <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3B82F6"/></marker>
      <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C847A"/><stop offset="1" stop-color="#10B981"/></linearGradient>
      <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B132B"/><stop offset="0.52" stop-color="#121C37"/><stop offset="1" stop-color="#162D43"/></linearGradient>
      <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#DCE5EF" stroke-width="1" opacity="0.55"/></pattern>
    </defs>
    <rect width="1600" height="1120" fill="#F4F7FB"/>
    <rect width="1600" height="1120" fill="url(#grid)" opacity="0.34"/>
    <circle cx="1540" cy="-25" r="205" fill="#E6F7F4" opacity="0.52"/>
    <circle cx="1590" cy="-50" r="120" fill="#EAF2FF" opacity="0.50"/>
    <text x="64" y="48" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#0C847A" letter-spacing="2">HELPMORA  /  SYSTEM ARCHITECTURE</text>
    <text x="64" y="103" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800" text-anchor="start" fill="#0B132B">From a citizen story to a guided next step</text>
    <text x="64" y="140" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="450" text-anchor="start" fill="#59677D">One shared workflow connects input, memory, orchestration and deterministic policy logic.</text>
    <rect x="64" y="180" width="300" height="112" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="64" y="180" width="7" height="112" rx="4" fill="#0C847A" stroke="#0C847A" stroke-width="0"/><text x="90" y="219" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="750" text-anchor="start" fill="#15223B">Omi transcript event</text><text x="90" y="248.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Webhook adapter validates and</text><text x="90" y="269.75" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">normalizes supported events.</text><rect x="390" y="180" width="300" height="112" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="390" y="180" width="7" height="112" rx="4" fill="#3B82F6" stroke="#3B82F6" stroke-width="0"/><text x="416" y="219" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="750" text-anchor="start" fill="#15223B">Typed chat</text><text x="416" y="248.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Existing text interface and</text><text x="416" y="269.75" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">conversation entry point.</text><rect x="716" y="180" width="300" height="112" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="716" y="180" width="7" height="112" rx="4" fill="#7567E8" stroke="#7567E8" stroke-width="0"/><text x="742" y="219" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="750" text-anchor="start" fill="#15223B">Browser microphone</text><text x="742" y="248.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Optional voice path where enabled;</text><text x="742" y="269.75" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">not a substitute for Omi.</text><path d="M 214 292 V 326 H 540 V 352" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><path d="M 540 292 V 326 H 540 V 352" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><path d="M 866 292 V 326 H 540 V 352" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="330" y="352" width="420" height="104" rx="20" fill="#FFF5D9" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="330" y="352" width="7" height="104" rx="4" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/><text x="356" y="391" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="750" text-anchor="start" fill="#15223B">cmguard + guardrails</text><text x="356" y="420.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Route allowlist · payload limits · rate limits</text><text x="356" y="443.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Domain and crisis checks</text><path d="M 750 378 H 910" stroke="#E85D8F" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="930" y="350" width="570" height="104" rx="20" fill="#FFF0F5" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="930" y="350" width="7" height="104" rx="4" fill="#E85D8F" stroke="#E85D8F" stroke-width="0"/><text x="956" y="389" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#15223B">Immediate crisis branch</text><text x="956" y="418.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Use existing deterministic EscalationWalker; avoid unnecessary model delay.</text><path d="M 540 456 V 495" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="330" y="495" width="420" height="98" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="330" y="495" width="7" height="98" rx="4" fill="#0C847A" stroke="#0C847A" stroke-width="0"/><text x="356" y="534" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#15223B">Case resolution + normalization</text><text x="356" y="563.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Resolve user / case / session scope and structured facts.</text><path d="M 540 593 V 626 H 285 V 652" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="70" y="652" width="345" height="122" rx="20" fill="#EAF2FF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="70" y="652" width="7" height="122" rx="4" fill="#3B82F6" stroke="#3B82F6" stroke-width="0"/><text x="96" y="691" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#15223B">Qdrant memory</text><text x="96" y="720.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Retrieve relevant, user-scoped context</text><text x="96" y="743.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">when configured and consented.</text><path d="M 415 713 H 495" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="500" y="652" width="330" height="122" rx="20" fill="#F0EEFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="500" y="652" width="7" height="122" rx="4" fill="#7567E8" stroke="#7567E8" stroke-width="0"/><text x="526" y="691" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#15223B">Lyzr orchestration</text><text x="526" y="720.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Manager / specialist agents when</text><text x="526" y="743.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">configured; structured tool calls.</text><path d="M 830 713 H 910" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="915" y="652" width="345" height="122" rx="20" fill="#E7F9F0" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="915" y="652" width="7" height="122" rx="4" fill="#10B981" stroke="#10B981" stroke-width="0"/><text x="941" y="691" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#15223B">Existing Jac core</text><text x="941" y="720.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Deterministic eligibility, graph search,</text><text x="941" y="743.2" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">navigation and crisis logic.</text><rect x="1280" y="652" width="250" height="122" rx="20" fill="#FFF5D9" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="1280" y="652" width="7" height="122" rx="4" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/><text x="1306" y="691" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="750" text-anchor="start" fill="#15223B">Verification</text><text x="1306" y="720.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Check completeness, consistency</text><text x="1306" y="741.75" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">and available provenance.</text><path d="M 1260 713 H 1280" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><path d="M 1405 774 V 818 H 1060 V 842" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="815" y="842" width="490" height="100" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="815" y="842" width="7" height="100" rx="4" fill="#0C847A" stroke="#0C847A" stroke-width="0"/><text x="841" y="881" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#15223B">Guided delivery + user review</text><text x="841" y="910.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="450" text-anchor="start" fill="#59677D">Explain result, ask for missing facts, and wait for approval when required.</text><path d="M 1060 942 V 970" stroke="#0C847A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#arrow)"/><rect x="710" y="970" width="700" height="82" rx="18" fill="#0B132B" stroke="#0B132B" stroke-width="1"/><circle cx="744" cy="1010" r="7" fill="#10B981"/><text x="765" y="1005" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="750" text-anchor="start" fill="#FFFFFF">Permitted milestone write</text><text x="765" y="1030" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#CDD8E7">Persist only when enabled and allowed by user privacy settings.</text><rect x="64" y="842" width="690" height="100" rx="18" fill="#E7F9F0" stroke="#B8E8D1" stroke-width="1.3"/><text x="88" y="876" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="850" text-anchor="start" fill="#0C847A" letter-spacing="1.7">POLICY AUTHORITY</text><text x="88" y="909" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="750" text-anchor="start" fill="#15223B">AI coordinates. Jac policy logic decides eligibility.</text><text x="88" y="931" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">No LLM-invented schemes, thresholds or crisis contacts.</text></svg>