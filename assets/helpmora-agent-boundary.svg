erif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Extract facts; summarize</text><text x="82.0" y="463" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">authorized case context.</text><rect x="82.0" y="491" width="245.60000000000002" height="4" rx="2" fill="#E6F7F4" stroke="#E6F7F4" stroke-width="0"/><path d="M 580 305 V 335 H 502.40000000000003 V 365" stroke="#D8E1EC" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="361.6" y="365" width="281.6" height="160" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="361.6" y="365" width="281.6" height="7" rx="4" fill="#3B82F6" stroke="#3B82F6" stroke-width="0"/><text x="379.6" y="403" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" fill="#15223B">ResourceAgent</text><text x="379.6" y="440" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Find candidates in the</text><text x="379.6" y="463" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">approved catalog.</text><rect x="379.6" y="491" width="245.60000000000002" height="4" rx="2" fill="#EAF2FF" stroke="#EAF2FF" stroke-width="0"/><path d="M 580 305 V 335 H 800.0 V 365" stroke="#D8E1EC" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="659.2" y="365" width="281.6" height="160" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="659.2" y="365" width="281.6" height="7" rx="4" fill="#F59E0B" stroke="#F59E0B" stroke-width="0"/><text x="677.2" y="403" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" fill="#15223B">EligibilityAgent</text><text x="677.2" y="440" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Prepare inputs; call the</text><text x="677.2" y="463" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">deterministic tool.</text><rect x="677.2" y="491" width="245.60000000000002" height="4" rx="2" fill="#FFF5D9" stroke="#FFF5D9" stroke-width="0"/><path d="M 580 305 V 335 H 1097.6000000000001 V 365" stroke="#D8E1EC" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="956.8000000000001" y="365" width="281.6" height="160" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="956.8000000000001" y="365" width="281.6" height="7" rx="4" fill="#7567E8" stroke="#7567E8" stroke-width="0"/><text x="974.8000000000001" y="403" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start" fill="#15223B">PathfinderAgent</text><text x="974.8000000000001" y="440" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Request search of</text><text x="974.8000000000001" y="463" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">curated transitions.</text><rect x="974.8000000000001" y="491" width="245.60000000000002" height="4" rx="2" fill="#F0EEFF" stroke="#F0EEFF" stroke-width="0"/><path d="M 580 305 V 335 H 1395.2 V 365" stroke="#D8E1EC" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="1254.4" y="365" width="281.6" height="160" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="1254.4" y="365" width="281.6" height="7" rx="4" fill="#E85D8F" stroke="#E85D8F" stroke-width="0"/><text x="1272.4" y="403" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size