<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090">
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#16233B" flood-opacity="0.08"/></filter>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#0C847A"/></marker>
      <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#3B82F6"/></marker>
      <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C847A"/><stop offset="1" stop-color="#10B981"/></linearGradient>
      <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B132B"/><stop offset="0.52" stop-color="#121C37"/><stop offset="1" stop-color="#162D43"/></linearGradient>
      <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#DCE5EF" stroke-width="1" opacity="0.55"/></pattern>
    </defs>
    <rect width="1600" height="1090" fill="#F4F7FB"/>
    <rect width="1600" height="1090" fill="url(#grid)" opacity="0.34"/>
    <circle cx="1540" cy="-25" r="205" fill="#E6F7F4" opacity="0.52"/>
    <circle cx="1590" cy="-50" r="120" fill="#EAF2FF" opacity="0.50"/>
    <text x="64" y="48" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#0C847A" letter-spacing="2">HELPMORA  /  WALKER MAP</text>
    <text x="64" y="103" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800" text-anchor="start" fill="#0B132B">Jac walkers and supporting workflow modules</text>
    <text x="64" y="140" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="19" font-weight="450" text-anchor="start" fill="#59677D">Documented inventory grouped by responsibility; source presence alone does not prove runtime execution.</text>
    <rect x="64" y="180" width="1472" height="150" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="64" y="180" width="9" height="150" rx="4" fill="#0C847A" stroke="#0C847A" stroke-width="0"/><text x="90" y="212" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="850" text-anchor="start" fill="#0C847A" letter-spacing="1.4">CORE CASE FLOW</text><text x="90" y="236" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">The main path from intake to a practical action plan</text><rect x="90.0" y="252" width="274.4" height="60" rx="12" fill="#E6F7F4" stroke="#E6F7F4" stroke-width="0"/><text x="102.0" y="275" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">SeedWalker</text><text x="102.0" y="295" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">Initializes catalog and graph</text><text x="102.0" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">data</text><rect x="376.4" y="252" width="274.4" height="60" rx="12" fill="#E6F7F4" stroke="#E6F7F4" stroke-width="0"/><text x="388.4" y="275" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">IntakeWalker</text><text x="388.4" y="295" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">Extracts need, income, household,</text><text x="388.4" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">language and urgency</text><rect x="662.8" y="252" width="274.4" height="60" rx="12" fill="#E6F7F4" stroke="#E6F7F4" stroke-width="0"/><text x="674.8" y="275" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">EligibilityWalker</text><text x="674.8" y="295" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">Evaluates configured rules and</text><text x="674.8" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">ranks resources</text><rect x="949.1999999999999" y="252" width="274.4" height="60" rx="12" fill="#E6F7F4" stroke="#E6F7F4" stroke-width="0"/><text x="961.1999999999999" y="275" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">PathfinderWalker</text><text x="961.1999999999999" y="295" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">Searches curated `leads_to`</text><text x="961.1999999999999" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">transitions</text><rect x="1235.6" y="252" width="274.4" height="60" rx="12" fill="#E6F7F4" stroke="#E6F7F4" stroke-width="0"/><text x="1247.6" y="275" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">NavigationWalker</text><text x="1247.6" y="295" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">Builds action plan, documents and</text><text x="1247.6" y="310" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">channels</text><rect x="64" y="348" width="1472" height="138" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="64" y="348" width="9" height="138" rx="4" fill="#E85D8F" stroke="#E85D8F" stroke-width="0"/><text x="90" y="380" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="850" text-anchor="start" fill="#E85D8F" letter-spacing="1.4">SAFETY &amp; CASE MEMORY</text><text x="90" y="404" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">Crisis handling and user-controlled continuity</text><rect x="90.0" y="420" width="465.3333333333333" height="60" rx="12" fill="#FFF0F5" stroke="#FFF0F5" stroke-width="0"/><text x="102.0" y="443" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">EscalationWalker</text><text x="102.0" y="463" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">Deterministic crisis routing</text><rect x="567.3333333333333" y="420" width="465.3333333333333" height="60" rx="12" fill="#FFF0F5" stroke="#FFF0F5" stroke-width="0"/><text x="579.3333333333333" y="443" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">MemoryWalker</text><text x="579.3333333333333" y="463" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">Updates graph/case milestones</text><rect x="1044.6666666666665" y="420" width="465.3333333333333" height="60" rx="12" fill="#FFF0F5" stroke="#FFF0F5" stroke-width="0"/><text x="1056.6666666666665" y="443" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">ForgetWalker</text><text x="1056.6666666666665" y="463" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">Supports memory deletion / forget flow</text><rect x="64" y="504" width="1472" height="138" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="64" y="504" width="9" height="138" rx="4" fill="#3B82F6" stroke="#3B82F6" stroke-width="0"/><text x="90" y="536" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="850" text-anchor="start" fill="#3B82F6" letter-spacing="1.4">LANGUAGE &amp; QUALITY</text><text x="90" y="560" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">Guarded language output and reflective telemetry</text><rect x="90.0" y="576" width="465.3333333333333" height="60" rx="12" fill="#EAF2FF" stroke="#EAF2FF" stroke-width="0"/><text x="102.0" y="599" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">NarrateWalker</text><text x="102.0" y="619" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">Produces a guarded natural-language summary</text><rect x="567.3333333333333" y="576" width="465.3333333333333" height="60" rx="12" fill="#EAF2FF" stroke="#EAF2FF" stroke-width="0"/><text x="579.3333333333333" y="599" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">LocalizeWalker</text><text x="579.3333333333333" y="619" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">Supports localization/language mapping</text><rect x="1044.6666666666665" y="576" width="465.3333333333333" height="60" rx="12" fill="#EAF2FF" stroke="#EAF2FF" stroke-width="0"/><text x="1056.6666666666665" y="599" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">CritiqueWalker</text><text x="1056.6666666666665" y="619" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">Computes workflow quality/reflection signals</text><rect x="64" y="660" width="1472" height="138" rx="20" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.1" filter="url(#shadow)"/><rect x="64" y="660" width="9" height="138" rx="4" fill="#7567E8" stroke="#7567E8" stroke-width="0"/><text x="90" y="692" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="850" text-anchor="start" fill="#7567E8" letter-spacing="1.4">SUPPORTING PIPELINE MODULES</text><text x="90" y="716" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" fill="#59677D">Graph visibility and integration path</text><rect x="90.0" y="732" width="704.0" height="60" rx="12" fill="#F0EEFF" stroke="#F0EEFF" stroke-width="0"/><text x="102.0" y="755" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">Graph snapshot</text><text x="102.0" y="775" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">Serializes graph state for visualization</text><rect x="806.0" y="732" width="704.0" height="60" rx="12" fill="#F0EEFF" stroke="#F0EEFF" stroke-width="0"/><text x="818.0" y="755" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start" fill="#15223B">Integrated pipeline</text><text x="818.0" y="775" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="450" text-anchor="start" fill="#59677D">Connects the orchestration workflow</text><rect x="64" y="1014" width="1472" height="48" rx="14" fill="#0B132B" stroke="#0B132B" stroke-width="1"/><text x="88" y="1044" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#77D8C8">Runtime rule:</text><text x="190" y="1044" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="550" text-anchor="start" fill="#FFFFFF">Display a walker as active only when the running trace confirms it executed.</text></svg>