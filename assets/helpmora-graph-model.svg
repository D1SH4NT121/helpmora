text x="648" y="892" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="800" text-anchor="start" fill="#15223B">SessionInsight</text><text x="648" y="914" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">Execution / quality reflection</text><rect x="1115" y="700" width="230" height="110" rx="18" fill="#FFFFFF" stroke="#D8E1EC" stroke-width="1.2" filter="url(#shadow)"/><rect x="1115" y="700" width="230" height="7" rx="4" fill="#E85D8F" stroke="#E85D8F" stroke-width="0"/><rect x="1133" y="719" width="112" height="32" rx="16" fill="#FFF0F5" stroke="#FFF0F5" stroke-width="1"/><text x="1189.0" y="740" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#E85D8F">GRAPH NODE</text><text x="1133" y="772" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="800" text-anchor="start" fill="#15223B">ResourceNode (next)</text><text x="1133" y="794" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="450" text-anchor="start" fill="#59677D">A curated transition target</text><rect x="1360" y="205" width="175" height="285" rx="18" fill="#0B132B" stroke="#0B132B" stroke-width="1"/><text x="1382" y="240" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="800" text-anchor="start" fill="#89E2D5" letter-spacing="1">READ THE GRAPH</text><text x="1382" y="278" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#FFFFFF">Nodes hold</text><text x="1382" y="301" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#FFFFFF">structured records.</text><text x="1382" y="324" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#FFFFFF"></text><text x="1382" y="347" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#FFFFFF">Edges explain</text><text x="1382" y="370" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#FFFFFF">relationships and</text><text x="1382" y="393" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#FFFFFF">available routes.</text><text x="1382" y="416" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#FFFFFF"></text><text x="1382" y="439" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#FFFFFF">Curated edges</text><text x="1382" y="462" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#FFFFFF">limit invented</text><text x="1382" y="485" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="#FFFFFF">pathways.</text><text x="70" y="980" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="550" text-anchor="start" fill="#59677D">Do not expose personal node attributes in public graph snapshots or telemetry.</text></svg>